name: main
on:
  push:
    branches:
      - master

jobs:
  main:
    runs-on: ubuntu-latest
    environment:
      name: SemRel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DH_USERNAME }}
          password: ${{ secrets.DH_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          java-version: 21
          java-distribution: 'temurin'

      - name: Set Maven Version
        if: steps.semantic.outputs.new_release_published == 'true'
        run: "mvn versions:set -DnewVersion=${{steps.semantic.outputs.new_release_version}}"

      - name: Maven Build
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}
        run: "mvn install -Djib.to.auth.username=${DH_USERNAME} -Djib.to.auth.password=${DH_PASSWORD} -P jib-build"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.semantic.outputs.new_release_published == 'true'
        with:
          context: koku-frontend
          push: true
          tags: domschmidt/koku-frontend:${{steps.semantic.outputs.new_release_version}}
