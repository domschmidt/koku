name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    environment:
      name: SemRel

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=domschmidt_koku -Dsonar.organization=domschmidt

  frontend:
    name: Frontend lint and test and build
    runs-on: ubuntu-latest
    environment:
      name: SemRel

    defaults:
      run:
        working-directory: koku-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate backend DTO types
        working-directory: .
        run: mvn -B -T 1C -pl koku-frontend -am install -DskipTests

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: koku-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: koku-frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    timeout-minutes: 35
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: koku-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      KOKU_E2E_BASE_URL: http://127.0.0.1:4200
      KOKU_E2E_HOST: koku.test
      KOKU_E2E_KEYCLOAK_URL: http://koku.test:8081
      KOKU_E2E_PASSWORD: e2e-admin
      KOKU_E2E_SEED: "true"
      KOKU_E2E_USERNAME: e2e-admin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: koku-frontend/package-lock.json

      - name: Build backend images from this revision
        run: mvn -B install -Dmaven.test.skip=true -Pjib-dockerBuild

      - name: Build frontend image from this revision
        run: docker compose -f compose.e2e.yml build koku-frontend

      - name: Register the E2E hostname
        run: echo "127.0.0.1 koku.test" | sudo tee -a /etc/hosts

      - name: Start the E2E stack
        run: docker compose -f compose.e2e.yml up -d --wait --wait-timeout 240

      - name: Install frontend dependencies
        working-directory: koku-frontend
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Install Playwright Chromium
        working-directory: koku-frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: koku-frontend
        run: npm run e2e:ci

      - name: Capture container logs
        if: always()
        run: docker compose -f compose.e2e.yml logs --no-color > compose-e2e.log

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            compose-e2e.log
            koku-frontend/playwright-report
            koku-frontend/test-results

      - name: Stop the E2E stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v --remove-orphans

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
